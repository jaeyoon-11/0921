<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>underthesea</title>

	<link rel="icon" href="shell.png">

	<style>

		body {
			margin: 0;
			width: 100%;
			min-height: 120vh;

			background: linear-gradient(
				to bottom,
				#FFFFFF,
				#31FFE3,
				#0088FF,
				#0033FF
			);

			cursor: none;
		}


		.wrap {
			width: 90%;
			max-width: 1200px;
			height: 100vh;
			margin: auto;
			position: relative;
		}


		/* 해파리 */
		#jellyfish {
			width: 280px;
			position: absolute;
			left: 15%;
			top: 77px;
		}


		/* 물고기 */
		#fish {
			width: 350px;
			position: absolute;
			right: 6%;
			top: 32%;
		}


		/* 소라고둥 */
		#conch {
			width: 780px;
			position: absolute;
			left: 7%;
			bottom: -80px;
		}


		/* 마우스를 따라다니는 버블 */
		#bubble {
			width: 110px;
			position: fixed;
			pointer-events: none;
			transform: translate(-50%, -50%);
		}

	</style>
</head>


<body>

	<section>

		<div class="wrap">

			<!-- 해파리 -->
			<img src="jellyfish.png" id="jellyfish">
			<audio src="jellyfish.mp3" id="jsnd"></audio>


			<!-- 물고기 -->
			<img src="fish.png" id="fish">
			<audio src="fish.mp3" id="fsnd"></audio>


			<!-- 소라고둥 -->
			<img src="conch.png" id="conch">
			<audio src="conch.mp3" id="csnd"></audio>

		</div>

	</section>


	<!-- 마우스를 따라다니는 버블 -->
	<img src="bubble.png" id="bubble">


	<script>

		// 해파리
		let jsound = "no";

		jellyfish.onclick = function(){

			if(jsound == "no"){
				jsnd.play();
				jellyfish.style.opacity = "0.5";
				jsound = "yes";

			}else if(jsound == "yes"){
				jsnd.pause();
				jellyfish.style.opacity = "1";
				jsound = "no";
			}

		};


		// 물고기
		let fsound = "no";

		fish.onclick = function(){

			if(fsound == "no"){
				fsnd.play();
				fish.style.opacity = "0.5";
				fsound = "yes";

			}else if(fsound == "yes"){
				fsnd.pause();
				fish.style.opacity = "1";
				fsound = "no";
			}

		};


		// 소라고둥
		let csound = "no";

		conch.onclick = function(){

			if(csound == "no"){
				csnd.play();
				conch.style.opacity = "0.5";
				csound = "yes";

			}else if(csound == "yes"){
				csnd.pause();
				conch.style.opacity = "1";
				csound = "no";
			}

		};


		// 버블이 마우스 커서를 따라다니게 하기
		document.addEventListener("mousemove", function(event){
			bubble.style.left = event.clientX + "px";
			bubble.style.top = event.clientY + "px";
		});

	</script>

</body>
</html>
